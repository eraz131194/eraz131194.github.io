<!DOCTYPE html>
<html lang='hr'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, shrink-to-fit=no'>
    <meta http-equiv='X-UA-Compatible' content='ie=edge'>
    <meta name='description' content='Kontaktirajte Kroatus za instrukcije hrvatskog jezika za osnovnu i srednju školu, pripreme za državnu maturu ili lekturu akademskih radova.'>
    <meta name='keywords' content='kontakt instrukcije hrvatski, instrukcije hrvatski Zagreb, lektura završnog rada ponuda, pripreme matura kontakt'>
    <meta name='robots' content='index, follow'>
    <meta property='og:locale' content='hr_HR'>
    <meta property='og:title' content='Kroatus | Kontakt za instrukcije i lekturu'>
    <meta property='og:description' content='Pošaljite upit za instrukcije, pripreme za maturu ili lekturu akademskog, poslovnog ili drugog teksta.'>
    <meta property='og:type' content='website'>

    <title>Kroatus | Kontakt za instrukcije i lekturu</title>
    <link rel="shortcut icon" href="assets/favicons/favicon.ico" />
    <link rel="icon" href="assets/favicons/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon.svg">
    <link rel="icon" type="image/png" href="assets/favicons/96.png" sizes="96x96" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/180.png" />
    <link rel="apple-touch-icon" href="assets/favicons/192.png" />
    
    <link type='text/css' rel='stylesheet' href='css/bootstrap/bootstrap.min.css'/>
    <link type='text/css' rel='stylesheet' href='css/bootstrap/bootstrap-icons.min.css'/>
    <link type='text/css' rel='stylesheet' href='css/global.css'/>
    <link type='text/css' rel='stylesheet' href='css/contact.css'/>

    <script defer type='text/javascript' src='js/bootstrap/bootstrap.min.js'></script>
    <script defer type='text/javascript' src='js/global.js'></script>
    <script defer type='text/javascript' src='js/components/Navbar.js'></script>
    <script defer type='text/javascript' src='js/components/Footer.js'></script>
    <script defer type='text/javascript' src='js/contact.js'></script>

</head>

<body>

    <nav-bar></nav-bar>

    <main data-navbar="light">
        <section class="py-5 bg-accent-dark text-white text-center">
            <div class="container py-4">
                <h1 class="display-5 fw-bold">Kontaktirajte nas!</h1>
                <p class="lead opacity-75">Odgovori na sva Vaša pitanja o hrvatskome jeziku.</p>
            </div>
        </section>

        <section class="py-5">
            <div class="container">
                <div class="row g-5">
                    
                    <div class="col-lg-4">
                        <div class="mb-5">
                            <!-- <h2 class="h4 fw-bold mb-4">Kontakt informacije</h2> -->
                            
                            <div class="d-flex align-items-start mb-4">
                                <div class="bg-light round p-3 me-3 fc-accent-dark">
                                    <i class="bi bi-envelope-at h4"></i>
                                </div>
                                <div>
                                    <h5 class="mb-1 fw-bold">Elektronička adresa</h5>
                                    <p class="fc-muted mb-0">kroatus@gmail.com</p>
                                </div>
                            </div>

                            <div class="d-flex align-items-start mb-4">
                                <div class="bg-light round p-3 me-3 fc-accent-dark">
                                    <i class="bi bi-geo-alt h4"></i>
                                </div>
                                <div>
                                    <h5 class="mb-1 fw-bold">Lokacija</h5>
                                    <p class="fc-muted mb-0">Zagreb, Hrvatska<br>(Online poduke dostupne svugdje)</p>
                                </div>
                            </div>

                            <div class="d-flex align-items-start mb-4">
                                <div class="bg-light round p-3 me-3 fc-accent-dark">
                                    <i class="bi bi-telephone h4"></i>
                                </div>
                                <div>
                                    <h5 class="mb-1 fw-bold">Telefon</h5>
                                    <p class="fc-muted mb-0">+385 98 686 3026</p>
                                </div>
                            </div>

                            <div class="d-flex align-items-start mb-4">
                                <div class="bg-light round p-3 me-3 fc-accent-dark">
                                    <i class="bi bi-clock h4"></i>
                                </div>
                                <div>
                                    <h5 class="mb-1 fw-bold">Radno vrijeme</h5>
                                    <p class="fc-muted mb-0">Pon - Pet: 08:00 - 20:00</p>
                                </div>
                            </div>
                        </div>

                        <div>
                            <h2 class="h4 fw-bold mb-3">Pratite nas</h2>
                            <div class="d-flex gap-2">
                                <a href="#" class="btn btn-light round p-2 px-3 fc-accent-dark"><i class="bi bi-facebook"></i></a>
                                <a href="#" class="btn btn-light round p-2 px-3 fc-accent-dark"><i class="bi bi-instagram"></i></a>
                                <a href="#" class="btn btn-light round p-2 px-3 fc-accent-dark"><i class="bi bi-linkedin"></i></a>
                                <a href="#" class="btn btn-light round p-2 px-3 fc-accent-dark"><i class="bi bi-youtube"></i></a>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-8">
                        <div class="card round border-0 shadow-sm p-4 p-md-5">
                            <h2 class="fw-bold mb-4">Pošaljite poruku</h2>
                            <form id="contactForm">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="name" class="form-label fw-bold small">Ime i prezime</label>
                                        <input type="text" class="form-control" id="name" placeholder="Vaše ime" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="email" class="form-label fw-bold small">Elektronička adresa</label>
                                        <input type="email" class="form-control" id="email" placeholder="ime@primjer.com" required>
                                    </div>
                                    <div class="col-12">
                                        <label for="subject" class="form-label fw-bold small">Usluga koja Vas zanima</label>
                                        <select class="form-select" id="subject">
                                            <option selected>Odaberite uslugu...</option>
                                            <option value="proofreading">Lektura</option>
                                            <option value="schoolLessons">Instrukcije</option>
                                            <option value="graduationLessons">Priprema za maturu</option>
                                            <option value="other">Ostalo</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <label for="message" class="form-label fw-bold small">Vaša poruka</label>
                                        <textarea class="form-control" id="message" rows="6" placeholder="Kako Vam možemo pomoći?" required></textarea>
                                    </div>
                                    <div class="col-12 text-end">
                                        <button type="submit" class="btn btn-accent-fill btn-lg round px-5">
                                            Pošalji <i class="bi bi-send ms-2"></i>
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <section-footer></section-footer>

</body>

</html>
